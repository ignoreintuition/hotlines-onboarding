name: pyropaths-plugin-test
services:
  db:
    image: mariadb:11
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: local-test-only
      MARIADB_ROOT_PASSWORD: local-root-test-only
    healthcheck:
      test: [CMD, healthcheck.sh, --connect, --innodb_initialized]
      interval: 2s
      retries: 30
  wordpress:
    image: wordpress:php8.3-apache
    ports:
      - '127.0.0.1:8097:80'
    environment: &wordpress_env
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: local-test-only
    volumes: &wordpress_volumes
      - wordpress:/var/www/html
      - ../:/var/www/html/wp-content/plugins/hotlines-onboarding:ro
      - ./fixtures.php:/var/www/html/wp-content/mu-plugins/pyropaths-fixtures.php:ro
    depends_on:
      db:
        condition: service_healthy
  cli:
    image: wordpress:cli
    user: '33:33'
    environment: *wordpress_env
    volumes: *wordpress_volumes
    depends_on:
      - wordpress
volumes:
  wordpress:
